name: quark
options:
  bundleIdPrefix: tel.quark.app
  deploymentTarget:
    # Must match `bundle.iOS.minimumSystemVersion` in tauri.conf.json. This is
    # the source xcodegen generates the pbxproj from, so a mismatch here is not
    # cosmetic — regenerating silently rewrites the target the app ships with.
    iOS: 17.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Quark
      PRODUCT_BUNDLE_IDENTIFIER: tel.quark.app
      # Every setting the built project needs has to be declared here rather
      # than left in quark.xcodeproj/project.pbxproj, which xcodegen rewrites
      # from this file. A team id is not secret — it ships inside every signed
      # app — and without it a regenerated project cannot sign at all.
      DEVELOPMENT_TEAM: STY28WCV84
      # iPhone only. Left unset this defaults to "1,2", which puts the app in
      # front of App Review on an iPad and makes App Store Connect withhold
      # submission until iPad screenshots exist — for a layout that has never
      # been designed for one. QuarkNSE declares the same value: an extension
      # whose device family is wider than its host app's is a mismatch
      # validation can object to.
      TARGETED_DEVICE_FAMILY: "1"
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  quark_iOS:
    type: application
    platform: iOS
    # Mirrors PRODUCT_NAME in the `app` setting group. xcodegen does not read
    # setting groups when it names the buildable in the scheme, so without this
    # a regen writes `quark_iOS.app` into a scheme whose target actually builds
    # `Quark.app`.
    productName: Quark
    sources:
      - path: Sources
      - path: Assets.xcassets
      # In the navigator but in no build phase. Whether Externals has a
      # libapp.a in it when xcodegen runs depends entirely on whether a build
      # has happened since the last clean — and if one has, the default
      # classification copies a half-gigabyte static archive into the app
      # bundle as a resource. Linking is unaffected: the framework dependency
      # and LIBRARY_SEARCH_PATHS below are what actually find it.
      - path: Externals
        buildPhase: none
      # Carries PrivacyInfo.xcprivacy to the app bundle's root, alongside the
      # generated Info.plist and entitlements — which xcodegen keeps out of the
      # build phases because info.path/entitlements.path already name them.
      # The manifest must end up in Copy Bundle Resources: verify after a regen,
      # because a file xcodegen fails to classify lands in no phase at all and
      # the only symptom is an ITMS-91053 email once the upload has processed.
      - path: quark_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: quark_iOS/Info.plist
      # xcodegen writes quark_iOS/Info.plist from these properties, so anything
      # missing here is deleted from the plist on the next regen. The usage
      # descriptions matter most: iOS terminates the app the moment it touches
      # the camera, microphone or photo library without them, so losing them
      # builds and signs cleanly and only fails in the user's hands.
      properties:
        LSRequiresIPhoneOS: true
        # Export compliance, answered once in the binary rather than on every
        # upload. Quark's cryptography is Olm/Megolm over Curve25519, Ed25519,
        # AES-256, HMAC-SHA-256 and HKDF — all published, none proprietary — and
        # the source is public, so under 15 CFR 742.15(b)(1) it is not subject to
        # the EAR at all. The notification in 742.15(b)(2) has, since the March
        # 2021 rule, reached only "non-standard cryptography" (772.1: unpublished
        # or proprietary), which this is not.
        #
        # So `false` asserts "no NON-EXEMPT encryption" — it does not claim the
        # app has no encryption. Without the key, App Store Connect parks every
        # build in Missing Compliance until the question is answered by hand.
        ITSAppUsesNonExemptEncryption: false
        # APNs delivers `content-available` pushes to a suspended app only if it
        # declares this. Without it the push is dropped before the extension is
        # ever consulted, which looks exactly like a gateway that never fired.
        UIBackgroundModes:
          - remote-notification
        NSCameraUsageDescription: Quark needs camera access so you can take a photo or video to send in a chat.
        NSMicrophoneUsageDescription: Quark needs microphone access so videos you record to send include sound.
        NSPhotoLibraryUsageDescription: Quark needs photo library access so you can attach existing photos and videos to a chat.
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.19.0
        # The BUILD NUMBER, not the marketing version. App Store Connect
        # requires this to strictly increase on every upload sharing one
        # CFBundleShortVersionString, so it cannot track the version: a
        # rejected build, a signing fix, or any second attempt at the same
        # release needs a second value. `version-bump build` increments it
        # across all four places it appears; a marketing version bump leaves it
        # alone. It stays an integer — dotted forms compare component-wise and
        # invite a mistake no error message explains.
        CFBundleVersion: "3"
        # Declares the app a legitimate target for INSendMessageIntent, which is
        # half of what lets the NSE render pushes as communication notifications
        # (sender avatar, native "sender in group" header). The entitlement
        # below is the other half; missing either silently downgrades to the
        # plain-text rendering.
        NSUserActivityTypes:
          - INSendMessageIntent
    entitlements:
      # xcodegen *writes* this file from these properties — a key added to the
      # .entitlements by hand survives until the next `xcodegen generate` and
      # then vanishes, taking push with it and leaving a build that signs fine.
      # `aps-environment` is `development` for local Xcode builds; TestFlight
      # and App Store export re-sign it to `production`. The matching app_id is
      # no longer a second switch to keep in step: `apns::detect_sandbox` reads
      # this very entitlement back out of the embedded provisioning profile at
      # runtime, so registration follows whatever the build was signed as.
      path: quark_iOS/quark_iOS.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.tel.quark.app
        # Communication Notifications. On the app only — iOS validates the
        # styled rendering against the host app's entitlements even though the
        # extension is what donates the intent, and the extension's own profile
        # refuses the key. If signing rejects it here too, the capability needs
        # ticking on the tel.quark.app App ID in the portal.
        com.apple.developer.usernotifications.communication: true
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      # Embeds the extension into the app bundle's PlugIns directory. Without
      # this the extension builds and signs and is simply never installed, so
      # every push renders the loc-key placeholder.
      - target: QuarkNSE
        embed: true
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      # main.mm asks for notification permission before registering for remote
      # notifications; without this the link fails rather than the push.
      - sdk: UserNotifications.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  # ── Notification service extension ────────────────────────────────────────
  #
  # A second process, launched by iOS for each push carrying
  # `mutable-content: 1`, with ~30s and ~24 MB to turn a room id and an event id
  # into a readable notification. Swift only: no Rust, no matrix-sdk, and so no
  # decryption until Phase 4.
  QuarkNSE:
    type: app-extension
    platform: iOS
    sources:
      - path: QuarkNSE
    info:
      path: QuarkNSE/Info.plist
      properties:
        CFBundleDisplayName: Quark Notifications
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          # PRODUCT_MODULE_NAME follows PRODUCT_NAME, so this resolves to
          # QuarkNSE.NotificationService. A typo here fails at push time with no
          # log, not at build time.
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        # Must match the app's, or App Store validation rejects the pair. The
        # version-bump script rewrites both keys across every target in this
        # file — the marketing version on a version bump, the build number on
        # `version-bump build` — so these stay in lockstep with the app's above.
        CFBundleShortVersionString: 0.19.0
        CFBundleVersion: "3"
    entitlements:
      # The app group and nothing else. `aps-environment` belongs to the app,
      # and so does the communication-notifications grant: iOS validates the
      # styled rendering against the *host app's* entitlements, and a profile
      # for the extension's App ID refuses the key outright ("Entitlement ...
      # not found and could not be included in profile").
      path: QuarkNSE/QuarkNSE.entitlements
      properties:
        com.apple.security.application-groups:
          - group.tel.quark.app
    settings:
      base:
        # Must be a child of the app's bundle id, or iOS refuses to install it.
        PRODUCT_BUNDLE_IDENTIFIER: tel.quark.app.nse
        DEVELOPMENT_TEAM: STY28WCV84
        # Equal to the app's, deliberately. The NSE does not inherit the `app`
        # setting group, so leaving this unset would widen the extension to
        # iPad while the host app is iPhone-only.
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: 5.0
        # The extension links no third-party Swift and rides the app's copy of
        # the standard libraries; embedding a second set would just add weight.
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: false
        ARCHS: [arm64]
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
    dependencies:
      - sdk: UserNotifications.framework
      # INSendMessageIntent — the communication-notification rendering.
      - sdk: Intents.framework
