<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no / maximum-scale=1 are what actually disable pinch-zoom on
         iOS: WebKit does not let `touch-action` suppress the page-level pinch
         gesture, so the `touch-action` rules in base.css never covered it. Images
         keep their own pinch-to-zoom, which ImageLightbox implements in JS and
         this does not affect; desktop browsers ignore the viewport meta entirely.
         Android's "force enable zoom" accessibility setting overrides this meta,
         which is why viewportMetrics (src/app/mobile.ts) stays scale-aware. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Quark</title>
    <link rel="stylesheet" href="/src/style/base.css" />
    <link rel="stylesheet" href="/src/theme/vars.css" />
  </head>
  <body>
    <!-- Startup overlay — visible from first paint, before any JS runs, so the
         login screen never flashes during session restore. main.ts dismisses it
         once the app is ready (see dismissStartupOverlay). -->
    <div id="startup-overlay" aria-hidden="true">
      <div class="startup-overlay__inner">
        <div class="startup-overlay__logo">QUARK</div>
        <div class="startup-overlay__sub">matrix client</div>
        <div class="startup-overlay__progress">
          <div class="startup-overlay__bar"></div>
        </div>
      </div>
      <div class="startup-overlay__scanlines"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
