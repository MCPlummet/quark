<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Page zoom stays available on purpose. It was briefly off (user-scalable=no,
         maximum-scale=1) because a zoomed shell confused the keyboard math —
         visualViewport.height shrinks with the zoom, which the layout read as an
         open keyboard — and left the fixed chrome misaligned. viewportMetrics is
         scale-aware now (src/app/mobile.ts), so the math holds while zoomed, and
         the compose region's touch-action rules still keep a gesture that starts
         there off the viewport. Without this the timeline has no magnification at
         all: font_size lives in a theme file no phone can edit (WCAG 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quark</title>
    <link rel="stylesheet" href="/src/style/base.css" />
    <link rel="stylesheet" href="/src/theme/vars.css" />
  </head>
  <body>
    <!-- Startup overlay — visible from first paint, before any JS runs, so the
         login screen never flashes during session restore. main.ts dismisses it
         once the app is ready (see dismissStartupOverlay). -->
    <div id="startup-overlay" aria-hidden="true">
      <div class="startup-overlay__inner">
        <div class="startup-overlay__logo">QUARK</div>
        <div class="startup-overlay__sub">matrix client</div>
        <div class="startup-overlay__progress">
          <div class="startup-overlay__bar"></div>
        </div>
      </div>
      <div class="startup-overlay__scanlines"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
