# Quark — Continuous Integration (test + lint)
#
# Runs on every pull request and on pushes to `main`. This is the gate that
# keeps `main` green; the heavy release/build pipeline lives in release.yml and
# only fires on tags.
#
# Jobs:
#   • test   — HARD GATE. Installs the Linux/Tauri system deps, Rust, and pnpm,
#              runs `pnpm build` (which also type-checks via tsc), then
#              `pnpm test` (vitest) and `cargo test` (with rustc warnings denied).
#              A failure blocks the merge.
#   • nix-deps — HARD GATE. Builds the flake's pnpmDeps fixed-output derivation
#              to assert nix/package.nix's pinned hash still matches
#              pnpm-lock.yaml. Fetch only, no Rust compile.
#   • clippy — ADVISORY. Runs `cargo clippy` but is marked continue-on-error so
#              it never blocks a merge — the backend carries known clippy
#              warnings and a deliberate hand-formatting style, so clippy can't
#              hard-gate yet.
#
# Required repository secrets: NONE. This workflow needs no secrets at all —
# only the automatically-provided GITHUB_TOKEN (not used here beyond checkout).
#
# pnpm is pinned via package.json "packageManager": "pnpm@10.32.1" and honoured
# through corepack. pnpm 11 needs Node 22.13+, so we deliberately stay on Node
# 20 + pnpm 10.x.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-flight run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation state is dead weight in CI (the restored cache IS
  # the increment) and debug info dominates debug-profile target size while
  # nothing in CI reads it — disabling both keeps the Rust cache lean.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # ─── test (hard gate) ──────────────────────────────────────────────────────
  test:
    name: Test (frontend + backend)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 / webkit2gtk 4.1 system dependencies.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libsqlite3-dev \
            build-essential \
            pkg-config \
            file \
            xdg-utils

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Cargo workspace lives under src-tauri/.
          workspaces: src-tauri

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # Version is read from package.json "packageManager" (pnpm@10.32.1).

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` runs `tsc && vite build` — this also type-checks the
      # frontend, so a type error fails here before any test runs. It produces
      # dist/, which tauri::generate_context!() embeds at compile time.
      - name: Build frontend
        run: pnpm build

      - name: Run frontend tests (vitest)
        run: pnpm test

      # -D warnings promotes every rustc warning to a hard error, so the gate
      # also asserts the backend compiles warning-free. #71 cleared the tree to
      # zero after an `unused variable: new_content` had been masking a real
      # edit-fallback defect for several releases; without a gate the next one
      # goes unnoticed the same way. Cargo builds registry and git dependencies
      # with --cap-lints allow, so this only ever fails on our own crates.
      #
      # It rides on `cargo test` rather than a separate `cargo check` step
      # because RUSTFLAGS is part of the build fingerprint — a second step with
      # different flags would recompile the whole dependency tree.
      #
      # Note this is stricter than the advisory clippy job, which stays
      # non-blocking: clippy's suggestion set is far broader (28 open on this
      # tree) and is style-heavy, whereas rustc's own warnings are few and
      # nearly always signal.
      - name: Run backend tests (cargo test, warnings denied)
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          RUSTFLAGS: "-Dwarnings"

  # ─── nix-deps (hard gate) ──────────────────────────────────────────────────
  #
  # nix/package.nix pins the hash of the offline pnpm store that fetchPnpmDeps
  # builds from pnpm-lock.yaml. Nothing local ever forces that pin to be
  # revisited: fetchPnpmDeps addresses its output by (name, hash) alone, and the
  # name carries no version, so a developer whose store still holds the previous
  # fetch keeps reusing it after the lockfile moves — the pin silently rots and
  # only strangers hit it. That is exactly how the hash went two releases stale
  # behind pnpm-lock.yaml's refresh in #44 (form-data 4.0.5 → 4.0.6 et al),
  # surfacing as ERR_PNPM_NO_OFFLINE_TARBALL for anyone installing the flake.
  #
  # A fresh runner has no such store path and cannot substitute one (this
  # derivation exists in no public cache), so the fetch genuinely re-runs and
  # the hash is genuinely checked. Do NOT add a Nix store cache to this job —
  # caching the FOD would restore the very masking this gate exists to catch.
  #
  # Deliberately builds only .pnpmDeps, not .#quark: the drift this catches is
  # settled by the fetch, while a full build would add a Tauri/matrix-sdk
  # compile to every PR for no extra signal.
  nix-deps:
    name: Nix pnpm deps hash
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Fails with "hash mismatch in fixed-output derivation" the moment
      # pnpm-lock.yaml and nix/package.nix's pnpmDeps.hash disagree. The fix is
      # in the comment beside that hash: set it to lib.fakeHash, rebuild, copy
      # the "got:" value back.
      - name: Verify pnpmDeps hash matches pnpm-lock.yaml
        run: nix build --no-link --print-out-paths '.#quark.pnpmDeps'

  # ─── clippy (advisory — never blocks) ──────────────────────────────────────
  clippy:
    name: Clippy (advisory)
    runs-on: ubuntu-22.04
    # Advisory: surface lint signal without gating the merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # clippy needs the same native libs to link against during analysis.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libssl-dev \
            libsqlite3-dev \
            build-essential \
            pkg-config

      - name: Set up Rust (stable) with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Separate cache key from the test job so debug + clippy artifacts
          # don't thrash one archive.
          key: clippy

      # tauri::generate_context!() embeds ../dist at compile time and panics if
      # it's missing. clippy doesn't run `pnpm build`, so stage a placeholder.
      - name: Stage dist placeholder for generate_context!
        run: |
          mkdir -p dist
          echo '<!doctype html><title>quark</title>' > dist/index.html

      - name: Run clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
